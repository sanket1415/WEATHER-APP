<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Page -->
    <div id="login-page" class="container">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit" id="login-btn">Login</button>
        </form>
    </div>

    <!-- Weather App (Initially hidden) -->
    <div id="weather-app" class="container" style="display: none;">
        <!-- Weather App content goes here (same as your existing HTML) -->
        <div class="top-bar">
            <input type="text" id="city-input" placeholder="City">
            <button id="search-btn">Search</button>
            <button id="location-btn">Your Location Weather</button>
        </div>

        <div class="weather-info">
            <div class="current-weather">
                <h2>Delhi</h2>
                <h1>31 &#8451</h1>
                <p>Haze</p>
                <button class="refresh-button">&#8635;</button>
            </div>
            <div class="weather-container">
                <div class="weather-item">
                    <span class="label">Felt Temp.</span>
                    <span class="value">33.05°C</span>
                </div>
                <div class="weather-item">
                    <span class="label">Humidity</span>
                    <span class="value">51%</span>
                </div>
                <div class="weather-item">
                    <span class="label">Wind</span>
                    <span class="value">14.83 Km/h</span>
                </div>
                <div class="weather-item">
                    <span class="label">Visibility</span>
                    <span class="value">3.5 Km</span>
                </div>
                <div class="weather-item">
                    <span class="label">Max Temp.</span>
                    <span class="value">31.20°C</span>
                </div>
                <div class="weather-item">
                    <span class="label">Min Temp.</span>
                    <span class="value">31.20°C</span>
                </div>
            </div>
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224346.90697947192!2d77.06889792499999!3d28.5272803!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d02282b3e6baf%3A0xbf8ed228a9f3b94d!2sDelhi%2C%20India!5e0!3m2!1sen!2sus!4v1625048305646!5m2!1sen!2sus"
                    width="411" height="330" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>

        <div class="forecast">
            <!-- Forecast items will go here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
